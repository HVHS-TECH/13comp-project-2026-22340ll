<!DOCTYPE html>
<html lang="en">

<head>
  <title>C.0.P.Y Derivitive</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- p5 - load first -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.4/lib/addons/p5.sound.min.js"></script>

  <!-- physics + p5play -->
  <script src="https://cdn.jsdelivr.net/npm/planck-js@0.3.31/dist/planck.min.js"></script>
  <script src="https://p5play.org/v3/p5play.js"></script>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div id="audio-prompt"
    style="position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,0.85);z-index:1000;flex-direction:column;gap:20px;color:#fff;z-index:9999;">
    <h2>Click to enable audio and start</h2>
    <button id="unlock-audio"
      style="padding:12px 20px;font-size:16px;border-radius:6px;border:none;background:#4CAF50;color:#fff;cursor:pointer;">
      Enable Audio & Start
    </button>
  </div>

  <!-- Load Firebase (use compat version to avoid conflicts) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  
  <script>
    // Initialize Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAWFMXdbKAkUGCzsrge1XvQzWG_FPWBXbI",
        authDomain: "comp-2026-leon-lim.firebaseapp.com",
        databaseURL: "https://comp-2026-leon-lim-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "comp-2026-leon-lim",
        storageBucket: "comp-2026-leon-lim.firebasestorage.app",
        messagingSenderId: "1092074281505",
        appId: "1:1092074281505:web:4dc7d8eaf21fb278eea160",
        measurementId: "G-12JTLL44XH"
    };
    
    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();
    
    // Make Firebase available globally
    window.firebase = {
        auth: auth,
        database: database,
        saveScore: async (score) => {
            const user = auth.currentUser;
            if (!user) {
                console.log('No user logged in');
                return false;
            }
            
            try {
                // TRY BOTH POSSIBLE PATHS TO SEE WHICH ONE WORKS
                const scoreData = {
                    score: parseInt(score),
                    timestamp: new Date().toISOString(),
                    playerName: user.displayName || "Anonymous",
                    uid: user.uid
                };
                
                // Option 1: Direct under gameScore (matches your screenshot)
                await database.ref(`gameScore/${user.uid}`).set(scoreData);
                console.log('Score saved to gameScore/', user.uid);
                
                // ALSO try saving to Derivative_ if that's where scores go
                await database.ref(`gameScore/Derivative_/${user.uid}`).set(scoreData);
                console.log('Score also saved to gameScore/Derivative_/', user.uid);
                
                return true;
            } catch (error) {
                console.error("Failed to save score:", error);
                return false;
            }
        },
        // Function to test Firebase connection
        testConnection: async () => {
            try {
                const testRef = database.ref('test_connection');
                await testRef.set({ timestamp: Date.now() });
                console.log('Firebase write works!');
                await testRef.remove();
                return true;
            } catch (error) {
                console.error('Firebase write failed:', error);
                return false;
            }
        }
    };
    
    // Check authentication
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = '/index.html';
            return;
        }
        
        // Check if user is registered
        const snapshot = await database.ref('users/' + user.uid).once('value');
        
        if (!snapshot.exists()) {
            window.location.href = '/register.html';
            return;
        }
        
        console.log('User authenticated:', user.displayName);
        
        // Test Firebase connection
        const canWrite = await window.firebase.testConnection();
        console.log('Firebase write test:', canWrite ? 'SUCCESS' : 'FAILED');
        
        // Dispatch event that Firebase is ready
        window.dispatchEvent(new CustomEvent('firebase-ready', { detail: { user } }));
    });
    
    // Handle audio button click
    document.getElementById('unlock-audio').addEventListener('click', async () => {
        try {
            if (typeof window.userStartAudio === 'function') {
                await window.userStartAudio();
            }
            document.getElementById('audio-prompt').style.display = 'none';
        } catch (error) {
            console.error("Failed to enable audio:", error);
            document.getElementById('audio-prompt').style.display = 'none';
        }
    });
</script>
  
  <!-- Your game script -->
  <script src="../MJS/derivitive.js"></script>
</body>

</html>
