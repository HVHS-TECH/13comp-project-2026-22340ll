<!DOCTYPE html>
<html lang="en">

<head>
  <title>Derivitive: Starting Screen</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon (repo root) -->
  <link rel="icon" type="image/x-icon" href="13comp-project-2026-22340ll/assets/images/dtec_favicon.PNG">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/start-screen.css">

  <!-- P5.js & P5.play -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/addons/p5.sound.js"></script>
  <script src="https://p5play.org/v3/planck.min.js"></script>
  <script src="https://p5play.org/v3/p5play.js"></script>

  <!-- jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>

<body style="background-color: rgb(19, 7, 95);">

  <header>
    <div class="vertical-container">

      <!-- Images (correct relative path) -->
      <img src="../other/spacebutton.png" width="115" height="100" alt="Space Button">

      <!-- WORKING BUTTON -->
      <a onclick="" href="derivitive.html" class="fight-button">
        FIGHT!
      </a>

      <img src="../other/arror.png" width="100" height="100" alt="Arrow">

    </div>
  </header>

  <!-- SAFE Script (won't crash if button doesn't exist) -->
  <script>
    const signInBtn = document.getElementById('signInButton');

    if (signInBtn) {
      signInBtn.addEventListener('click', async () => {
        try {
          const user = await fb_signInWithGoogle();

          if (user) {
            const userExists = await fb_checkUserExists(user.uid);

            if (userExists) {
              const isAdmin = await fb_checkAdminStatus(user.uid);

              sessionStorage.setItem('isAdmin', isAdmin ? 'y' : 'n');
              sessionStorage.setItem('userEmail', user.email);

              window.location.href = 'startscreen.html';
            } else {
              window.location.href = 'register.html';
            }
          }

        } catch (error) {
          const err = document.getElementById('auth-error');
          if (err) {
            err.textContent = `Sign-in failed: ${error.message}`;
            err.style.display = 'block';
          }
        }
      });
    }
  </script>

</body>

</html>
